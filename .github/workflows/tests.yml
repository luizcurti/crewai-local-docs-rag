name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The tests cover the parsers, records, question analysis, ranking, answer assembly, the
      # answer cache, lookups on an in-memory Chroma collection and the web UI. They need no
      # Ollama, model or downloaded documentation.
      - run: pytest -v
